<html lang="en">

    <title>Zen — report a civic issue</title>
    <meta
      name="description"
      content="Report potholes, garbage, and streetlight issues with a photo and GPS pin, visible to everyone on a shared map."
    />

    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="icon" href="assets/icon-192.png" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css" />

      <!-- Router mounts here -->
    </div>
